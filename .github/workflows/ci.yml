name: ai-app-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only by design: validation code and AI tooling must never modify protected branches.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build/install
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      # Free deterministic gates run first so defects are caught before a paid cloud evaluation.
      - name: Lint
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: LLM eval gate
        if: ${{ github.event_name == 'pull_request' && success() }}
        env:
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAG_MODEL_ID: ${{ vars.RAG_MODEL_ID }}
          JUDGE_MODEL_ID: ${{ vars.JUDGE_MODEL_ID }}
          DELIBERATE_REGRESSION: "1"
        run: python -m evals.judge evals/cases.jsonl --min-groundedness 0.90
